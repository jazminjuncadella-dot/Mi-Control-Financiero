name: Generar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'Mi_Control_Financiero_GitHub_APK_Builder*.zip' | head -n 1)
          echo "Usando: $ZIP_FILE"
          unzip "$ZIP_FILE"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar APK
        working-directory: Mi_Control_Financiero_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Control-Financiero-APK
          path: Mi_Control_Financiero_Android/app/build/outputs/apk/debug/app-debug.apk
