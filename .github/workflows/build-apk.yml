name: Generar APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir V2
        run: |
          unzip -o Mi_Control_Financiero_GitHub_APK_Builder_V2.zip

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar APK V2
        working-directory: Mi_Control_Financiero_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar APK V2
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Control-Financiero-V2-APK
          path: Mi_Control_Financiero_Android/app/build/outputs/apk/debug/app-debug.apk
