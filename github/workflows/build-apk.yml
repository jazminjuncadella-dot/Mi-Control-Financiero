name: Generar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: |
          unzip Mi_Control_Financiero_GitHub_APK_Builder.zip
          ls -la
          ls -la Mi_Control_Financiero_Android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar APK
        working-directory: Mi_Control_Financiero_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Control-Financiero-APK
          path: Mi_Control_Financiero_Android/app/build/outputs/apk/debug/app-debug.apk
